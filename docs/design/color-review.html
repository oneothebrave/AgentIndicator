<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>普通状态 · 配色审核</title><style>*{box-sizing:border-box}body{margin:0;background:#efeeeb;color:#292d31;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:38px 28px}h1{font-size:30px;margin:0}p{color:#626870}nav{margin:24px 0}button{font:inherit;border:1px solid #c9cccd;border-radius:9px;background:white;padding:8px 18px;margin:0 8px 8px 0;cursor:pointer}button[aria-pressed=true]{background:#293e47;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{background:white;padding:18px;border-radius:20px}iframe{width:100%;aspect-ratio:4/3;border:0;border-radius:16px;display:block}h2{font-size:20px;margin:18px 0 5px}article p{font-size:14px;margin:8px 0}.badge{font-size:12px;color:#43736e}footer{margin-top:26px;font-size:14px;color:#626870}@media(max-width:780px){.grid{grid-template-columns:1fr}main{padding:24px}}</style><main><h1>普通状态，换一种更舒服的颜色</h1><p>第三轮：墨绿、水蜜桃色与银色。保留柔和色感，对比深色、暖色与冷灰色的表现。执行笔迹与眼睛、笔身使用同一主题色；本页仅供审核，尚未烧录。</p><nav><button data-state="idle" aria-pressed="true">空闲</button><button data-state="thinking" aria-pressed="false">思考</button><button data-state="running" aria-pressed="false">执行</button><button data-state="done" aria-pressed="false">完成</button><button id="pause">暂停</button></nav><section class="grid"><article><iframe title="墨绿动态表情" src="color-review-sea.html"></iframe><h2>01 · 墨绿</h2><span class="badge">#42695A</span><p>墨绿偏深，带少量灰调，沉静耐看；实屏需要重点确认亮度是否足够。</p></article><article><iframe title="水蜜桃动态表情" src="color-review-blue.html"></iframe><h2>02 · 水蜜桃</h2><span class="badge">#D9AAA0</span><p>柔和的粉桃色，带暖调，亲近而轻盈，避免鲜艳的糖果粉。</p></article><article><iframe title="银色动态表情" src="color-review-sage.html"></iframe><h2>03 · 银色</h2><span class="badge">#B8BDC4</span><p>略带冷调的银灰，干净简洁。使用平面色，不添加金属渐变；实屏可能更接近柔白。</p></article></section><footer>等待仍使用浓琥珀，异常保持深红，离线保持中性灰。屏幕与网页的色感可能不同，选定后再做实屏确认。</footer></main><script>const frames=[...document.querySelectorAll('iframe')];let state='idle',paused=false;function sync(){for(const f of frames){f.contentWindow.postMessage({type:'review-state',state},'*');f.contentWindow.postMessage({type:'review-pause',paused},'*')}}frames.forEach(f=>f.onload=sync);document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-pressed',x===b));sync()});document.getElementById('pause').onclick=()=>{paused=!paused;for(const f of frames)f.contentWindow.postMessage({type:'review-pause',paused},'*');document.getElementById('pause').textContent=paused?'播放':'暂停'};</script></html>
